# A minimal alembic.ini for PostgreSQL
[alembic]
# path to your migration scripts
script_location = alembic

# db url (replace YOUR_PASSWORD)
sqlalchemy.url = postgresql+psycopg2://postgres:CHERRY718hf@localhost:5432/vigilis_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
